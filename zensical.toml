# ============================================================================
# Zensical configuration — migrated from mkdocs.yml
#
# Zensical uses this TOML file (NOT mkdocs.yml) as its source of truth.
# Build:   uv run zensical build      (output -> ./site)
# Preview: uv run zensical serve      (http://localhost:8000)
#
# Plugins from the old mkdocs.yml that Zensical does not yet support were
# dropped (Zensical is still pre-1.0 and working toward feature parity):
#   - optimize                  (image compression; re-add when supported)
#   - minify                    (HTML/JS/CSS minification; Zensical already
#                                ships minified theme assets)
#   - git-revision-date-localized  ("Last updated" dates)
#   - privacy                   (localizing external assets such as fonts)
#   - tags                      (tag index pages)
# Track support at https://zensical.org/compatibility/
# ============================================================================

[project]
site_name = "Jiahao Miao"
site_url = "https://jiahaomiao.github.io/"
site_author = "Jiahao Miao"
site_description = "Personal website of a Theoretical Particle Physics Master's student."
copyright = "Copyright &copy; 2024 - 2026 Jiahao Miao | CC BY-SA 4.0"

# Source repository (renders the repo link/icon in the header)
repo_url = "https://github.com/JiahaoMiao/jiahaomiao.github.io"
repo_name = "Jiahao Miao"

# Paths are relative to the docs directory (docs/).
# KaTeX is intentionally loaded from a CDN for math rendering.
extra_javascript = [
    "https://unpkg.com/katex@0/dist/katex.min.js",
    "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
    "javascripts/katex.js",          # renders math on page load
    "javascripts/external-links.js", # opens pdfs/links in new tabs
    "javascripts/baryon.js",         # animated quark-dance homepage background
]
extra_css = [
    "https://unpkg.com/katex@0/dist/katex.min.css",
    "stylesheets/home.css",          # homepage hero + attractor background styling
]

nav = [
    { "Home" = "index.md" },
    { "About" = [
        { "CV & Education" = "about/cv.md" },
        { "Research Interests" = "about/research.md" },
    ] },
    { "Academic" = [
        { "Publications" = "academic/publications.md" },
        { "Workshops & Talks" = "academic/workshops.md" },
        { "Projects" = "academic/projects.md" },
    ] },
    { "Resources" = "resources/notes.md" },
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
# "classic" keeps the traditional Material for MkDocs look (matches your
# existing design / custom CSS). Remove this line (or set "modern") to switch
# to Zensical's new default look.
variant = "classic"

custom_dir = "overrides"
favicon = "assets/images/favicon.svg"
logo = "assets/images/favicon.svg"
language = "en"

features = [
    "content.code.copy",
    "content.code.annotate",
    "content.tooltips",
    "navigation.indexes",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.top",
    "navigation.tracking",
    "toc.follow",
    "search.highlight",
    "search.share",
]

[project.theme.font]
text = "IBM Plex Sans"
code = "Fira Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

# Color palettes (auto / light / dark), mirroring the previous mkdocs setup.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "deep purple"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "teal"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

# ----------------------------------------------------------------------------
# Social links (footer)
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/JiahaoMiao"
[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:jiahao.miao@studenti.unimi.it"
[[project.extra.social]]
icon = "fontawesome/brands/orcid"
link = "https://orcid.org/0009-0001-7429-9186"
[[project.extra.social]]
icon = "fontawesome/solid/lightbulb"
link = "https://inspirehep.net/authors/2940765"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.admonition]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.abbr]
[project.markdown_extensions.def_list]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.critic]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
auto_append = ["includes/glossary.md"]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
