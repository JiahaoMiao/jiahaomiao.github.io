{% extends "main.html" %}

{% block tabs %}
  {{ super() }}

  <style>
    /* The home header (and tabs) float over the hero with no background of
       their own. Material's primary=black palette paints both bars a solid dark
       via [data-md-color-primary=black] {.md-header,.md-tabs} rules whose (0,2,0)
       specificity beats a plain `.md-header { background: transparent }` (0,1,0)
       — so the bar stayed dark, and the light-mode text (forced dark below) was
       dark-on-dark and invisible. Re-assert transparency at matching specificity
       (these in-body rules win the tie on source order) and colour the text per
       scheme: dark ink over the light hero, white over the slate hero, so the
       title, palette toggle and source link stay legible in both. */
    .md-header { position: absolute; box-shadow: none; width: 100%; }

    [data-md-color-scheme="default"] .md-header,
    [data-md-color-scheme="default"] .md-tabs { background-color: transparent; }
    [data-md-color-scheme="default"] .md-header,
    [data-md-color-scheme="default"] .md-tabs,
    [data-md-color-scheme="default"] .md-tabs__link { color: #141a24; }

    [data-md-color-scheme="slate"] .md-header,
    [data-md-color-scheme="slate"] .md-tabs { background-color: transparent; }
    [data-md-color-scheme="slate"] .md-header,
    [data-md-color-scheme="slate"] .md-tabs,
    [data-md-color-scheme="slate"] .md-tabs__link { color: #fff; }
    /* Force main container to touch edges */
    .md-main__inner { margin-top: 0; }

    /* Hide Sidebars */
    @media screen and (min-width: 60em) { .md-sidebar--secondary { display: none; } }
    @media screen and (min-width: 76.25em) { .md-sidebar--primary { display: none; } }
  </style>

  <section class="hero-container">
    <canvas id="hero-canvas"></canvas>

    <div class="hero-content">
      <h1>Jiahao Miao</h1>
      <p>Theoretical Particle Physics &bull; University of Milan</p>

      <div class="hero-buttons">
        <a href="about/cv/" class="md-button">View CV</a>
        <a href="academic/publications/" class="md-button">Publications</a>
      </div>
    </div>
  </section>
{% endblock %}
