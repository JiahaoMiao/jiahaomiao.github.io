{% extends "main.html" %}

{% block tabs %}
  {{ super() }}

  <style>
    /* Hide the header shadow on home for cleaner look */
    .md-header { position: absolute; background: transparent; box-shadow: none; width: 100%; }
    /* The transparent header sits over the hero. Its icons/title default to the
       primary's contrast colour (white) — correct over the dark hero, but
       invisible over the LIGHT hero. In light mode force them dark so they stay
       legible (and the palette toggle stays findable on the landing page). */
    [data-md-color-scheme="default"] .md-header { color: #141a24; }
    /* Force main container to touch edges */
    .md-main__inner { margin-top: 0; }

    /* Hide Sidebars */
    @media screen and (min-width: 60em) { .md-sidebar--secondary { display: none; } }
    @media screen and (min-width: 76.25em) { .md-sidebar--primary { display: none; } }
  </style>

  <section class="hero-container">
    <canvas id="hero-canvas"></canvas>

    <div class="hero-content">
      <h1>Jiahao Miao</h1>
      <p>Theoretical Particle Physics &bull; University of Milan</p>

      <div class="hero-buttons">
        <a href="about/cv/" class="md-button">View CV</a>
        <a href="academic/publications/" class="md-button">Publications</a>
      </div>
    </div>
  </section>
{% endblock %}
